name: Feature request
description: Suggest an idea for NativQL
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do that NativQL doesn't support yet?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: engine
    attributes:
      label: Applies to
      options:
        - label: PostgreSQL
        - label: MySQL
