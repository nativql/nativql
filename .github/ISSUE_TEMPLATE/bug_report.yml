name: Bug report
description: Report a problem with NativQL
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message shown in the app if any.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database engine
      options:
        - PostgreSQL
        - MySQL
        - Both / not applicable
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: e.g. PostgreSQL 16.3, MySQL 8.0.36
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NativQL version / commit
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
